- name: Run Real Stress Test
  shell: pwsh
  run: |
    docker run --rm `
      --isolation=process `
      --cpus=0.2 `
      --memory=2G `
      -v "${PWD}:C:/app" `
      -w C:/app `
      python:3.12-windowsservercore-ltsc2022 `
      python -c "import time; while True: [i**0.5 for i in range(1000000)]"
