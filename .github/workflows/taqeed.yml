name: Ultimate-1D-Counter-No Script (Container Test)

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      # -----------------------------------------------------------
      # خطوة 0: تحضير السكربت الداخلي الذي سيعمل داخل الحاوية
      # -----------------------------------------------------------
      - name: Prepare Internal Script
        shell: pwsh
        run: |
          @'
          # container_script.ps1
          Write-Host "[CONTAINER] Starting container script..."

          # تثبيت Chrome داخل الحاوية
          Write-Host "[CONTAINER] Downloading Chrome..."
          Invoke-WebRequest -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile "chrome_installer.exe"
          Start-Process -FilePath "chrome_installer.exe" -Args "/silent /install" -Wait

          # تثبيت CRD Host
          Write-Host "[CONTAINER] Downloading CRD Host..."
          Invoke-WebRequest -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" -OutFile "crd.msi"
          Start-Process -FilePath "msiexec.exe" -Args "/i crd.msi /quiet /qn" -Wait

          # تشغيل CRD مع الكود والـ PIN من المتغيرات البيئية
          $exePath = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          $UniqueName = "${{ github.actor }}-Machine-Container"
          
          Write-Host "[CONTAINER] Starting CRD service with name: $UniqueName"
          & $exePath --code="$env:CRD_CODE" --redirect-url="https://remotedesktop.google.com/_/oauthredirect" --name="$UniqueName" --pin=$env:CRD_PIN

          # البقاء حياً (لأن CRD يعمل في الخلفية، نبقى نائمين)
          Write-Host "[CONTAINER] Keeping container alive..."
          while ($true) { Start-Sleep -Seconds 300 }
          '@ | Out-File -FilePath "container_script.ps1" -Encoding UTF8

      # -----------------------------------------------------------
      # خطوة 1: تشغيل الحاوية المعزولة مع تحديد 20% CPU
      # -----------------------------------------------------------
      - name: Run Isolated Container with CPU 20%
        shell: pwsh
        env:
          CRD_CODE: ${{ secrets.CRD_CODE }}
          CRD_PIN: ${{ secrets.CRD_PIN }}
        run: |
          Write-Host "🚀 Launching Windows Container with CPU limit 20%..."

          # استخدام صورة Windows Server Core LTSC 2022
          docker run --rm `
            --isolation=process `
            --cpus=0.2 `
            --memory=4G `
            -v "${PWD}:C:/host" `
            -w C:/host `
            -e CRD_CODE="$env:CRD_CODE" `
            -e CRD_PIN="$env:CRD_PIN" `
            mcr.microsoft.com/windows/servercore:ltsc2022 `
            powershell -File container_script.ps1

          Write-Host "✅ Container finished execution (should not happen)."
