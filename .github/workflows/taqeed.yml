name: Strict 20% CPU Hard-Cap Test
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Start Docker Engine
        shell: pwsh
        run: |
          Set-Service docker -StartupType Automatic
          Start-Service docker

      - name: Execute Strict CPU Hard-Cap Verification
        shell: pwsh
        run: |
          $script = @'
          Write-Host "[CONTAINER] Initializing Single-Thread CPU Burner..."

          Add-Type -TypeDefinition @"
          using System;
          using System.Threading;

          public class SingleThreadBurner {
              public static void StartBurn() {
                  Thread t = new Thread(() => {
                      while (true) {
                          // Tight loop on 1 core
                      }
                  });
                  t.IsBackground = true;
                  t.Priority = ThreadPriority.Highest;
                  t.Start();
              }
          }
          "@

          [SingleThreadBurner]::StartBurn()

          Write-Host "[CONTAINER] Warming up and letting Windows Job Object rate limiter stabilize..."
          Start-Sleep -Seconds 3

          Write-Host "[CONTAINER] Starting CPU hard-cap monitoring with 3-second smoothed window..."
          Write-Host "---------------------------------------------------------------------------------"

          $process = [System.Diagnostics.Process]::GetCurrentProcess()
          $globalSw = [System.Diagnostics.Stopwatch]::StartNew()
          $globalStartCpu = $process.TotalProcessorTime

          $history = @()
          $exceeded = $false
          $maxSmoothed = 0

          for ($i = 1; $i -le 10; $i++) {
              $startIntervalCpu = $process.TotalProcessorTime
              $intervalSw = [System.Diagnostics.Stopwatch]::StartNew()
              
              Start-Sleep -Seconds 1
              
              $intervalSw.Stop()
              $endIntervalCpu = $process.TotalProcessorTime

              # حساب استهلاك الثانية الحالية
              $intervalCpuMs = ($endIntervalCpu - $startIntervalCpu).TotalMilliseconds
              $intervalTimeMs = $intervalSw.Elapsed.TotalMilliseconds
              $instantUsage = ($intervalCpuMs / $intervalTimeMs) * 100

              # الاحتفاظ بآخر 3 ثوانٍ لحساب المتوسط المتحرك (إلغاء Quantum Jitter)
              $history += $instantUsage
              if ($history.Count -gt 3) { $history = $history[1..($history.Count - 1)] }
              
              $smoothedUsage = ($history | Measure-Object -Average).Average
              if ($smoothedUsage -gt $maxSmoothed) { $maxSmoothed = $smoothedUsage }

              # حساب الاستهلاك التراكمي الإجمالي
              $totalCpuMs = ($endIntervalCpu - $globalStartCpu).TotalMilliseconds
              $currentTimeMs = $globalSw.Elapsed.TotalMilliseconds
              $cumulativeUsage = ($totalCpuMs / $currentTimeMs) * 100

              # الحد المسموح به للمتوسط المتحرك هو 22.0% (تغطية الهامش الزمني)
              $status = if ($smoothedUsage -le 22.0) { "OK" } else { "BREACHED!" }
              Write-Host ("Sample {0,2}/10 -> 3s Smoothed: {1,5:N1}% | Cumulative: {2,5:N1}% [{3}]" -f $i, $smoothedUsage, $cumulativeUsage, $status)

              if ($i -ge 3 -and $smoothedUsage -gt 22.0) {
                  $exceeded = $true
              }
          }

          $globalSw.Stop()

          Write-Host "---------------------------------------------------------------------------------"
          Write-Host "=== FINAL HARD-CAP VERIFICATION ==="
          Write-Host "Target Limit           : 20.0% of 1 Core"
          Write-Host "Peak 3s Smoothed Usage : $($maxSmoothed.ToString('0.0'))%"
          Write-Host "Final Cumulative Usage : $($cumulativeUsage.ToString('0.0'))%"
          Write-Host "---------------------------------------------------------------------------------"

          if (-not $exceeded) {
              Write-Host "✅ HARD-CAP STRICTLY ENFORCED: Enforced rate limit held tightly at ~20%!"
          } else {
              Write-Host "❌ HARD-CAP BREACHED: CPU usage exceeded the allowed limit!"
              exit 1
          }
          '@

          $script | Out-File -FilePath stress.ps1 -Encoding ASCII

          docker run --rm `
            --isolation=process `
            --cpus=0.2 `
            --memory=2G `
            -v "${PWD}:C:/app" `
            -w C:/app `
            mcr.microsoft.com/windows/servercore:ltsc2022 `
            powershell -ExecutionPolicy Bypass -File C:/app/stress.ps1
