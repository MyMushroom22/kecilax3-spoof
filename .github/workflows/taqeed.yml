name: CPU Cap Test - Real
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Run CPU Stress in Container (4 processes)
        shell: pwsh
        run: |
          $script = @'
          Write-Host "[CONTAINER] Starting REAL CPU stress with 4 separate processes..."

          # تشغيل 4 عمليات PowerShell منفصلة (بدون Start-Job)
          1..4 | ForEach-Object {
              Start-Process -FilePath "powershell" -ArgumentList "-Command `"while (`$true) { `$sum = 0.0; for (`$i = 0; `$i -lt 1000000; `$i++) { `$sum += [Math]::Sqrt(`$i) } }`"" -WindowStyle Hidden
          }

          Write-Host "[CONTAINER] Collecting CPU samples every 2 seconds for 60 seconds..."
          $samples = @()
          for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              try {
                  $cpu = (Get-Counter -Counter "\Processor(_Total)\% Processor Time" -ErrorAction Stop).CounterSamples[0].CookedValue
                  $samples += $cpu
                  Write-Host "Sample $($i+1): $($cpu.ToString('0.0'))%"
              } catch {
                  Write-Host "Sample $($i+1): [error]"
              }
          }

          # إنهاء عمليات PowerShell الزائدة
          Get-Process -Name powershell -ErrorAction SilentlyContinue | Where-Object { $_.Id -ne $pid } | Stop-Process -Force

          $avg = ($samples | Measure-Object -Average).Average
          $max = ($samples | Measure-Object -Maximum).Maximum
          Write-Host "======================================"
          Write-Host "=== FINAL RESULT ==="
          Write-Host "Average Total CPU Usage: $($avg.ToString('0.0'))%"
          Write-Host "Maximum Total CPU Usage: $($max.ToString('0.0'))%"
          Write-Host "======================================"
          if ($max -le 22) {
              Write-Host "✅ SUCCESS: CPU limit is working correctly!"
          } else {
              Write-Host "❌ WARNING: CPU exceeded limit (should be ~20%)!"
          }
          '@
          $script | Out-File -FilePath stress.ps1 -Encoding ASCII

          docker run --rm `
            --isolation=process `
            --cpus=0.2 `
            --memory=2G `
            -v "${PWD}:C:/app" `
            -w C:/app `
            mcr.microsoft.com/windows/servercore:ltsc2022 `
            powershell -ExecutionPolicy Bypass -File C:/app/stress.ps1
