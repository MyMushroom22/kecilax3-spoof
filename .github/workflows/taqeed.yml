name: CPU Cap Test - Final
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Run CPU Stress in Container
        shell: pwsh
        run: |
          docker run --rm --isolation=process --cpus=0.2 --memory=2G mcr.microsoft.com/windows/servercore:ltsc2022 powershell -Command "Write-Host 'Starting stress test...'; $jobs = @(); 1..4 | ForEach-Object { $jobs += Start-Job -ScriptBlock { while ($true) { $sum = 0.0; for ($i = 0; $i -lt 1000000; $i++) { $sum += [Math]::Sqrt($i) } } } }; Write-Host 'Collecting samples for 60 seconds...'; $samples = @(); for ($i = 0; $i -lt 30; $i++) { Start-Sleep -Seconds 2; $cpu = (Get-Counter -Counter '\Processor(_Total)\% Processor Time').CounterSamples[0].CookedValue; $samples += $cpu; Write-Host ('Sample {0}: {1:N1}%' -f ($i+1), $cpu) }; $jobs | ForEach-Object { Stop-Job $_; Remove-Job $_ }; $avg = ($samples | Measure-Object -Average).Average; $max = ($samples | Measure-Object -Maximum).Maximum; Write-Host 'Average: ' $avg ' Max: ' $max"
