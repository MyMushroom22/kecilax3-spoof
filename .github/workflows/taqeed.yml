name: Container Max CPU Stress Test (Limit 20%)

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      # -----------------------------------------------------------
      # خطوة 1: كتابة سكربت اختبار الإجهاد مع قياس CPU
      # -----------------------------------------------------------
      - name: Prepare Stress Script
        shell: pwsh
        run: |
          Write-Host "Generating stress_test.ps1..."
          @'
          Write-Host "[CONTAINER] Starting MAX CPU stress test..."
          Write-Host "[CONTAINER] This will consume as much CPU as allowed (capped at 20% by Docker)."

          # تشغيل 4 خيوط تستهلك CPU لأقصى حمل
          $jobs = @()
          for ($i = 0; $i -lt 4; $i++) {
              $jobs += Start-Job -ScriptBlock {
                  while ($true) {
                      $sum = 0
                      for ($j = 0; $j -lt 10000000; $j++) {
                          $sum += [Math]::Sqrt($j)
                      }
                      Start-Sleep -Milliseconds 50
                  }
              }
          }

          Write-Host "[CONTAINER] Collecting CPU samples every 3 seconds for 30 seconds..."

          # دالة للحصول على استهلاك CPU بأمان
          function Get-CpuUsage {
              try {
                  $counter = Get-Counter -Counter "\Processor(_Total)\% Processor Time" -ErrorAction Stop
                  return $counter.CounterSamples[0].CookedValue
              } catch {
                  # محاولة بديلة باستخدام typeperf
                  try {
                      $output = & typeperf "\Processor(_Total)\% Processor Time" -sc 1 2>$null
                      $match = [regex]::Match($output, '(\d+\.\d+)')
                      if ($match.Success) { return [double]$match.Value }
                  } catch {}
                  return $null
              }
          }

          $samples = @()
          for ($i = 0; $i -lt 10; $i++) {
              Start-Sleep -Seconds 3
              $cpu = Get-CpuUsage
              if ($cpu -ne $null) {
                  $samples += $cpu
                  Write-Host "Sample $($i+1): $($cpu.ToString('0.0'))%"
              } else {
                  Write-Host "Sample $($i+1): [failed to read]"
              }
          }

          # إنهاء مهام الإجهاد
          foreach ($job in $jobs) {
              Stop-Job $job
              Remove-Job $job
          }

          if ($samples.Count -gt 0) {
              $avg = ($samples | Measure-Object -Average).Average
              $max = ($samples | Measure-Object -Maximum).Maximum
              Write-Host "======================================"
              Write-Host "=== STRESS TEST RESULT ==="
              Write-Host "Average Total CPU Usage: $($avg.ToString('0.0'))%"
              Write-Host "Max Total CPU Usage: $($max.ToString('0.0'))%"
              Write-Host "======================================"
              if ($max -le 22) {
                  Write-Host "✅ SUCCESS: CPU limit is working correctly!"
              } else {
                  Write-Host "❌ WARNING: CPU usage exceeded limit (should be ~20%)!"
              }
          } else {
              Write-Host "⚠️ No samples collected. The limit test cannot be confirmed."
          }
          '@ | Out-File -FilePath stress_test.ps1 -Encoding ASCII

      # -----------------------------------------------------------
      # خطوة 2: تشغيل الحاوية مع تقييد 20%
      # -----------------------------------------------------------
      - name: Run Stress Test in Container
        shell: pwsh
        run: |
          Write-Host "🚀 Launching container with CPU limit 20% (stress test)..."
          
          docker run --rm `
            --isolation=process `
            --cpus=0.2 `
            --memory=2G `
            -v "${PWD}:C:/app" `
            -w C:/app `
            mcr.microsoft.com/windows/servercore:ltsc2022 `
            powershell -ExecutionPolicy Bypass -File stress_test.ps1
