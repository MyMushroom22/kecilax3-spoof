name: Strict 20% CPU Hard-Cap Test
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Start Docker Engine
        shell: pwsh
        run: |
          Set-Service docker -StartupType Automatic
          Start-Service docker

      - name: Execute Strict CPU Hard-Cap Verification
        shell: pwsh
        run: |
          $script = @'
          Write-Host "[CONTAINER] Initializing C# maximum CPU stress threads..."

          # كود ضغط أقصى بالطاقة الكاملة لطلب 100% معالج بشكل مستمر
          Add-Type -TypeDefinition @"
          using System;
          using System.Threading;

          public class StrictBurner {
              public static void StartBurn() {
                  int cores = Environment.ProcessorCount;
                  for (int i = 0; i < cores * 2; i++) {
                      Thread t = new Thread(() => {
                          while (true) {
                              // Tight infinite loop
                          }
                      });
                      t.IsBackground = true;
                      t.Priority = ThreadPriority.Highest;
                      t.Start();
                  }
              }
          }
          "@

          [StrictBurner]::StartBurn()

          # فترة انتظار حتى يغلق Windows Job Object Rate Limiter الخناق على الحاوية
          Write-Host "[CONTAINER] Waiting 3 seconds for CPU Rate Limiter to stabilize..."
          Start-Sleep -Seconds 3

          Write-Host "[CONTAINER] Establishing baseline and starting strict interval monitoring..."
          Write-Host "---------------------------------------------------------------------------------"

          $process = [System.Diagnostics.Process]::GetCurrentProcess()
          
          # نقطة الصفر للقياس التراكمي واللحظي
          $globalSw = [System.Diagnostics.Stopwatch]::StartNew()
          $globalStartCpu = $process.TotalProcessorTime

          $lastCpu = $globalStartCpu
          $maxIntervalUsage = 0
          $exceeded = $false

          for ($i = 1; $i -le 10; $i++) {
              $intervalSw = [System.Diagnostics.Stopwatch]::StartNew()
              Start-Sleep -Seconds 1
              $intervalSw.Stop()

              $currentCpu = $process.TotalProcessorTime
              $currentTimeMs = $globalSw.Elapsed.TotalMilliseconds

              # 1. الاستهلاك اللحظي خلال الثانية الحالية فقط
              $intervalCpuMs = ($currentCpu - $lastCpu).TotalMilliseconds
              $intervalTimeMs = $intervalSw.Elapsed.TotalMilliseconds
              $instantUsage = ($intervalCpuMs / $intervalTimeMs) * 100

              # 2. الاستهلاك التراكمي الإجمالي
              $totalCpuMs = ($currentCpu - $globalStartCpu).TotalMilliseconds
              $cumulativeUsage = ($totalCpuMs / $currentTimeMs) * 100

              if ($instantUsage -gt $maxIntervalUsage) {
                  $maxIntervalUsage = $instantUsage
              }

              $lastCpu = $currentCpu

              # السماح بنسبة 21.0% كحد أقصى للتعامل مع دقة ساعات ويندوز (15.6ms Quantums)
              $status = if ($instantUsage -le 21.0) { "OK" } else { "BREACHED!" }
              Write-Host "Sample $i/10 -> Instant: $($instantUsage.ToString('0.0'))% | Cumulative: $($cumulativeUsage.ToString('0.0'))% [$status]"

              if ($instantUsage -gt 21.0) {
                  $exceeded = $true
              }
          }

          $globalSw.Stop()

          Write-Host "---------------------------------------------------------------------------------"
          Write-Host "=== FINAL HARD-CAP VERIFICATION ==="
          Write-Host "Target Limit        : 20.0% of 1 Core"
          Write-Host "Peak Instant Usage  : $($maxIntervalUsage.ToString('0.0'))%"
          Write-Host "Final Cumulative    : $($cumulativeUsage.ToString('0.0'))%"
          Write-Host "---------------------------------------------------------------------------------"

          if (-not $exceeded) {
              Write-Host "✅ HARD-CAP STRICTLY ENFORCED: CPU usage never breached the 20% limit!"
          } else {
              Write-Host "❌ HARD-CAP BREACHED: CPU usage exceeded the limit during runtime!"
              exit 1
          }
          '@

          $script | Out-File -FilePath stress.ps1 -Encoding ASCII

          docker run --rm `
            --isolation=process `
            --cpus=0.2 `
            --memory=2G `
            -v "${PWD}:C:/app" `
            -w C:/app `
            mcr.microsoft.com/windows/servercore:ltsc2022 `
            powershell -ExecutionPolicy Bypass -File C:/app/stress.ps1
