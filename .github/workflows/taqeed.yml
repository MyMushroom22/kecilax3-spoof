name: Ultimate-1D-Counter-No Script

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:

      # -----------------------------------------------------------
      # خطوة 0: حبس بيئة التشغيل بالكامل تحت حاجز 17% صارم بدون تذبذب
      # -----------------------------------------------------------
      - name: Global Environment Lock (17% Hard Cap)
        shell: pwsh
        run: |
          Write-Host "🔒 Locking entire step environment to 17% CPU Hard Cap..."

          $Source = @"
          using System;
          using System.Diagnostics;
          using System.Runtime.InteropServices;

          public class GlobalCpuLock {
              [DllImport("kernel32.dll", CharSet = CharSet.Auto)]
              public static extern IntPtr CreateJobObject(IntPtr lpJobAttributes, string lpName);

              [DllImport("kernel32.dll")]
              public static extern bool SetInformationJobObject(IntPtr hJob, int JobObjectInfoClass, IntPtr lpJobObjectInfo, uint cbJobObjectInfoLength);

              [DllImport("kernel32.dll")]
              public static extern bool AssignProcessToJobObject(IntPtr hJob, IntPtr hProcess);

              [StructLayout(LayoutKind.Sequential)]
              public struct JOBOBJECT_CPU_RATE_CONTROL_INFORMATION {
                  public uint ControlFlags;
                  public uint CpuRate;
              }

              public static void LockCurrentTree(uint percent) {
                  // 1. إنشاء حاجز صارم 17%
                  IntPtr hJob = CreateJobObject(IntPtr.Zero, "GlobalRunnerHardCap17");
                  
                  JOBOBJECT_CPU_RATE_CONTROL_INFORMATION info = new JOBOBJECT_CPU_RATE_CONTROL_INFORMATION();
                  // 0x1 = ENABLE, 0x4 = HARD_CAP (يمنع أي تجاوز نهائياً)
                  info.ControlFlags = 0x1 | 0x4; 
                  info.CpuRate = percent * 100; // 1700 = 17.00%

                  int length = Marshal.SizeOf(info);
                  IntPtr pInfo = Marshal.AllocHGlobal(length);
                  Marshal.StructureToPtr(info, pInfo, false);

                  SetInformationJobObject(hJob, 8, pInfo, (uint)length);
                  Marshal.FreeHGlobal(pInfo);

                  // 2. إدخال العملية الحالية (PowerShell) وأبنائها داخل الحبس
                  Process currentProcess = Process.GetCurrentProcess();
                  AssignProcessToJobObject(hJob, currentProcess.Handle);
              }
          }
          "@

          Add-Type -TypeDefinition $Source
          
          # إغلاق البيئة عند 17% تماماً
          [GlobalCpuLock]::LockCurrentTree(17)
          Write-Host "✅ Environment Root Process locked successfully at 17% CPU."

      # -----------------------------------------------------------
      # باقي خطوات الـ Workflow الخاصة بك (ستعمل جميعها داخل حاجز الـ 17%)
      # -----------------------------------------------------------
      - name: Install Prerequisites (Chrome, CRD, VBox)
        shell: pwsh
        run: |
          Write-Host "⬇️ Downloading Chrome..."
          Invoke-WebRequest -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile "chrome_installer.exe"
          Start-Process -FilePath "chrome_installer.exe" -Args "/silent /install" -Wait
          
          Write-Host "⬇️ Downloading CRD Host..."
          Invoke-WebRequest -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" -OutFile "crd.msi"
          Start-Process -FilePath "msiexec.exe" -Args "/i crd.msi /quiet /qn" -Wait

      - name: Start Chrome Remote Desktop
        shell: pwsh
        env:
          CRD_CODE: ${{ secrets.CRD_CODE }}
          CRD_PIN: ${{ secrets.CRD_PIN }}
        run: |
          $exePath = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          $UniqueName = "${{ github.actor }}-Machine-${{ env.DEVICE_NUM }}"
          
          Write-Host "🚀 STARTING RDP SERVICE: $UniqueName"
          & $exePath --code="$env:CRD_CODE" --redirect-url="https://remotedesktop.google.com/_/oauthredirect" --name="$UniqueName" --pin=$env:CRD_PIN

      - name: Keep Alive
        shell: pwsh
        run: |
          Write-Host "✅ Both VMs are running..."
          while ($true) { Start-Sleep -Seconds 300 }
