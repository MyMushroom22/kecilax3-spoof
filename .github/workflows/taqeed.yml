name: Isolated Container CPU Cap Test - Precision
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Start Docker Engine
        shell: pwsh
        run: |
          Set-Service docker -StartupType Automatic
          Start-Service docker

      - name: Run CPU Cap Verification Test
        shell: pwsh
        run: |
          $script = @'
          Write-Host "[CONTAINER] Starting CPU stress & precision sampler..."

          # كود ضغط خفيف وحاد بدون سحب ذاكرة
          Add-Type -TypeDefinition @"
          using System;
          using System.Threading;

          public class Burner {
              public static void Run() {
                  for (int i = 0; i < Environment.ProcessorCount; i++) {
                      Thread t = new Thread(() => { while (true) {} });
                      t.IsBackground = true;
                      t.Priority = ThreadPriority.BelowNormal;
                      t.Start();
                  }
              }
          }
          "@

          [Burner]::Run()

          Write-Host "[CONTAINER] Stabilizing workload (2 seconds)..."
          Start-Sleep -Seconds 2

          Write-Host "[CONTAINER] Measuring enforced average CPU limit..."
          Write-Host "----------------------------------------------------"

          $process = [System.Diagnostics.Process]::GetCurrentProcess()
          $startCpu = $process.TotalProcessorTime
          $sw = [System.Diagnostics.Stopwatch]::StartNew()

          # أخذ 10 عينات مع حساب المتوسط التراكمي المستمر
          for ($i = 1; $i -le 10; $i++) {
              Start-Sleep -Seconds 1

              $elapsedMs = $sw.Elapsed.TotalMilliseconds
              $cpuMs = ($process.TotalProcessorTime - $startCpu).TotalMilliseconds
              
              # حساب متوسط النسبة المئوية للتنفيذ من نواة واحدة
              $avgUsage = ($cpuMs / $elapsedMs) * 100

              Write-Host "Sample $i/10 -> Cumulative Average Usage: $($avgUsage.ToString('0.0'))% of 1 Core (Target: ~20.0%)"
          }

          $sw.Stop()
          Write-Host "----------------------------------------------------"
          
          # الحاوية تعمل بشكل صحيح إذا كان المتوسط التراكمي لا يتجاوز 22%
          if ($avgUsage -le 22.0) {
              Write-Host "✅ SUCCESS: Windows Job Object capped CPU strictly at $($avgUsage.ToString('0.0'))%!"
          } else {
              Write-Host "❌ WARNING: Average CPU usage ($($avgUsage.ToString('0.0'))%) exceeded cap!"
          }
          '@

          $script | Out-File -FilePath stress.ps1 -Encoding ASCII

          docker run --rm `
            --isolation=process `
            --cpus=0.2 `
            --memory=2G `
            -v "${PWD}:C:/app" `
            -w C:/app `
            mcr.microsoft.com/windows/servercore:ltsc2022 `
            powershell -ExecutionPolicy Bypass -File C:/app/stress.ps1
