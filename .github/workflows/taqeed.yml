name: Container CPU Limit Test (No Chrome)

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      # -----------------------------------------------------------
      # خطوة 1: كتابة سكربت بسيط يستمر للأبد (ping -t)
      # -----------------------------------------------------------
      - name: Prepare Container Script
        shell: pwsh
        run: |
          @'
          @echo off
          echo [CONTAINER] Starting infinite ping loop...
          ping -t 127.0.0.1
          '@ | Out-File -FilePath test_loop.cmd -Encoding ASCII

      # -----------------------------------------------------------
      # خطوة 2: تشغيل الحاوية مع تقييد 20% وتشغيل ping -t
      # -----------------------------------------------------------
      - name: Run Container with CPU 20% (Keep Alive)
        shell: pwsh
        run: |
          Write-Host "🚀 Launching container with CPU limit 20%..."
          
          docker run --rm `
            --isolation=process `
            --cpus=0.2 `
            --memory=2G `
            -v "${PWD}:C:/app" `
            -w C:/app `
            mcr.microsoft.com/windows/servercore:ltsc2022 `
            cmd /c test_loop.cmd
