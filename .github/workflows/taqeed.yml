name: Isolated Container CPU Cap Test
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Start Docker Engine
        shell: pwsh
        run: |
          Write-Host "Starting Docker Service on Windows Runner..."
          Set-Service docker -StartupType Automatic
          Start-Service docker
          docker info

      - name: Run CPU Stress Test Inside Capped Container
        shell: pwsh
        run: |
          $script = @'
          Write-Host "[CONTAINER] Starting CPU burner inside isolated container..."

          # إنشاء خيوط ضغط أصلية تستهلك المعالج بالكامل
          Add-Type -TypeDefinition @"
          using System;
          using System.Threading;

          public class Burner {
              public static void Run() {
                  for (int i = 0; i < Environment.ProcessorCount * 2; i++) {
                      Thread t = new Thread(() => { while (true) {} });
                      t.IsBackground = true;
                      t.Priority = ThreadPriority.BelowNormal;
                      t.Start();
                  }
              }
          }
          "@

          [Burner]::Run()

          Write-Host "[CONTAINER] Measuring capped CPU consumption live..."
          Write-Host "----------------------------------------------------"

          $process = [System.Diagnostics.Process]::GetCurrentProcess()

          for ($i = 1; $i -le 10; $i++) {
              $sw = [System.Diagnostics.Stopwatch]::StartNew()
              $startCpu = $process.TotalProcessorTime

              Start-Sleep -Seconds 1

              $sw.Stop()
              $endCpu = $process.TotalProcessorTime

              # حساب استهلاك المعالج مقارنة بنواة واحدة (1 Core = 100%)
              $cpuUsedMs = ($endCpu - $startCpu).TotalMilliseconds
              $timeElapsedMs = $sw.Elapsed.TotalMilliseconds
              $coreUsagePercent = ($cpuUsedMs / $timeElapsedMs) * 100

              Write-Host "Sample $i/10 -> Usage: $($coreUsagePercent.ToString('0.0'))% of 1 Core (Cap Target: 20.0%)"
          }

          Write-Host "----------------------------------------------------"
          if ($coreUsagePercent -le 22.0) {
              Write-Host "✅ SUCCESS: Docker CPU Cap (--cpus=0.2) is strictly enforced!"
          } else {
              Write-Host "❌ WARNING: Container exceeded CPU cap!"
          }
          '@

          $script | Out-File -FilePath stress.ps1 -Encoding ASCII

          # تشغيل الحاوية مع العزل والتحديد الصارم
          docker run --rm `
            --isolation=process `
            --cpus=0.2 `
            --memory=2G `
            -v "${PWD}:C:/app" `
            -w C:/app `
            mcr.microsoft.com/windows/servercore:ltsc2022 `
            powershell -ExecutionPolicy Bypass -File C:/app/stress.ps1
