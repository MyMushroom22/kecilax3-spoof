name: CPU Cap Test - Real
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Run Hardcore CPU Stress in Container
        shell: pwsh
        run: |
          $script = @'
          Write-Host "[CONTAINER] Starting HARDCORE CPU stress using C# native threads..."

          # تجميع كود C# ينشئ مسارات ضغط عالية الأولوية فوراً
          Add-Type -TypeDefinition @"
          using System;
          using System.Threading;

          public class CpuBurner {
              public static void Burn(int threadCount) {
                  for (int i = 0; i < threadCount; i++) {
                      Thread t = new Thread(() => {
                          while (true) {
                              // Tight infinite loop to maximize CPU pipeline usage
                          }
                      });
                      t.IsBackground = true;
                      t.Priority = ThreadPriority.Highest;
                      t.Start();
                  }
              }
          }
          "@

          # تشغيل 8 مسارات (Threads) لضمان إشباع كافة الأنوية فوراً
          [CpuBurner]::Burn(8)

          Write-Host "[CONTAINER] CPU stress active. Sampling metrics every 2 seconds..."
          $samples = @()

          for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 2
              try {
                  $cpu = (Get-Counter -Counter "\Processor(_Total)\% Processor Time" -ErrorAction Stop).CounterSamples[0].CookedValue
                  $samples += $cpu
                  Write-Host "Sample $($i+1): $($cpu.ToString('0.0'))%"
              } catch {
                  Write-Host "Sample $($i+1): [error reading counter]"
              }
          }

          $avg = ($samples | Measure-Object -Average).Average
          $max = ($samples | Measure-Object -Maximum).Maximum

          Write-Host "======================================"
          Write-Host "=== FINAL RESULT ==="
          Write-Host "Average CPU Usage: $($avg.ToString('0.0'))%"
          Write-Host "Maximum CPU Usage: $($max.ToString('0.0'))%"
          Write-Host "======================================"

          if ($max -le 22) {
              Write-Host "✅ SUCCESS: CPU cap constraint (--cpus=0.2) enforced properly!"
          } else {
              Write-Host "❌ WARNING: CPU exceeded limit!"
          }
          '@
          $script | Out-File -FilePath stress.ps1 -Encoding ASCII

          docker run --rm `
            --isolation=process `
            --cpus=0.2 `
            --memory=2G `
            -v "${PWD}:C:/app" `
            -w C:/app `
            mcr.microsoft.com/windows/servercore:ltsc2022 `
            powershell -ExecutionPolicy Bypass -File C:/app/stress.ps1
