name: Container CPU Limit Test (No Chrome)

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      # -----------------------------------------------------------
      # خطوة 1: كتابة سكربت اختبار CPU (باستخدام here-string)
      # -----------------------------------------------------------
      - name: Prepare Test Script
        shell: pwsh
        run: |
          @'
          Write-Host "[CONTAINER] Starting CPU stress test..."
          while ($true) {
              $sum = 0
              for ($i = 0; $i -lt 1000000; $i++) {
                  $sum += [Math]::Sqrt($i)
              }
              Start-Sleep -Milliseconds 100
          }
          '@ | Out-File -FilePath test_cpu.ps1 -Encoding UTF8

      # -----------------------------------------------------------
      # خطوة 2: تشغيل الحاوية مع تقييد 20%
      # -----------------------------------------------------------
      - name: Run Container with CPU 20% (Test Only)
        shell: pwsh
        run: |
          Write-Host "🚀 Launching container with CPU limit 20% (fast test)..."
          
          docker run --rm `
            --isolation=process `
            --cpus=0.2 `
            --memory=2G `
            -v "${PWD}:C:/app" `
            -w C:/app `
            mcr.microsoft.com/windows/servercore:ltsc2022 `
            powershell -File C:/app/test_cpu.ps1
