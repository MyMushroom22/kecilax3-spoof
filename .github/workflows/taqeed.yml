name: CPU Cap Test - Real
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Run Instant CPU Stress Test
        shell: pwsh
        run: |
          $script = @'
          Write-Host "[CONTAINER] Starting instant CPU stress test..."

          # كود C# مع ضبط أولوية BelowNormal لمنع تجميد خيط القراءة
          Add-Type -TypeDefinition @"
          using System;
          using System.Threading;

          public class CpuBurner {
              public static void StartBurn(int count) {
                  for (int i = 0; i < count; i++) {
                      Thread t = new Thread(() => {
                          while (true) {
                              // Tight loop to maximize CPU pipeline
                          }
                      });
                      t.IsBackground = true;
                      t.Priority = ThreadPriority.BelowNormal;
                      t.Start();
                  }
              }
          }
          "@

          # تشغيل 8 خيوط لضمان الضغط على كافة الأنوية
          [CpuBurner]::StartBurn(8)

          Write-Host "[CONTAINER] Stress active! Measuring instant CPU usage every 1 second..."

          $process = [System.Diagnostics.Process]::GetCurrentProcess()
          $cores = [Environment]::ProcessorCount

          $maxCpu = 0
          $totalCpu = 0
          $sampleCount = 10

          for ($i = 1; $i -le $sampleCount; $i++) {
              $sw = [System.Diagnostics.Stopwatch]::StartNew()
              $startCpu = $process.TotalProcessorTime

              Start-Sleep -Seconds 1

              $sw.Stop()
              $endCpu = $process.TotalProcessorTime

              # حساب استهلاك المعالج الفلي لحظياً
              $cpuUsedMs = ($endCpu - $startCpu).TotalMilliseconds
              $timeElapsedMs = $sw.Elapsed.TotalMilliseconds
              $cpuPercent = ($cpuUsedMs / ($timeElapsedMs * $cores)) * 100

              if ($cpuPercent -gt $maxCpu) { $maxCpu = $cpuPercent }
              $totalCpu += $cpuPercent

              Write-Host "Sample $i/$sampleCount -> Instant CPU Usage: $($cpuPercent.ToString('0.0'))%"
          }

          $avgCpu = $totalCpu / $sampleCount

          Write-Host "======================================"
          Write-Host "=== FINAL RESULT ==="
          Write-Host "Average CPU Usage: $($avgCpu.ToString('0.0'))%"
          Write-Host "Maximum CPU Usage: $($maxCpu.ToString('0.0'))%"
          Write-Host "======================================"

          if ($maxCpu -le 22) {
              Write-Host "✅ SUCCESS: CPU cap limit (--cpus=0.2) is working correctly!"
          } else {
              Write-Host "❌ WARNING: CPU exceeded limit!"
          }
          '@
          $script | Out-File -FilePath stress.ps1 -Encoding ASCII

          docker run --rm `
            --isolation=process `
            --cpus=0.2 `
            --memory=2G `
            -v "${PWD}:C:/app" `
            -w C:/app `
            mcr.microsoft.com/windows/servercore:ltsc2022 `
            powershell -ExecutionPolicy Bypass -File C:/app/stress.ps1
