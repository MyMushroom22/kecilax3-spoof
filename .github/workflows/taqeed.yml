name: Container CPU Limit Test (No Chrome)

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      # -----------------------------------------------------------
      # خطوة 1: كتابة سكربت اختبار CPU داخل الحاوية
      # -----------------------------------------------------------
      - name: Prepare Test Script
        shell: pwsh
        run: |
          @'
          # test_cpu.ps1
          Write-Host "[CONTAINER] Starting CPU stress test..."
          
          # استخدام بايثون (موجود في الصورة؟ لا، لكننا سنثبته بسرعة)
          # بدلاً من ذلك، نستخدم حلقة PowerShell ثقيلة (لكنها قد لا تستهلك 100% دقيقة).
          # الأفضل: تثبيت Python بسرعة داخل الحاوية.
          
          Write-Host "[CONTAINER] Installing Python via winget (fast)..."
          winget install Python.Python.3.12 --silent --accept-package-agreements
          
          # كتابة سكربت بايثون بسيط يستهلك CPU
          @'
          import time
          import os
          print(f"PID: {os.getpid()}")
          print("Starting CPU burn loop...")
          while True:
              for i in range(1000000):
                  _ = i ** 0.5
              time.sleep(0.1)
          '@ | Out-File -FilePath "cpu_burn.py" -Encoding UTF8

          # تشغيل سكربت CPU
          Write-Host "[CONTAINER] Running CPU burner (should be limited to 20% by Docker)..."
          python cpu_burn.py
          '@ | Out-File -FilePath "test_cpu.ps1" -Encoding UTF8

      # -----------------------------------------------------------
      # خطوة 2: تشغيل الحاوية وتقييد CPU إلى 20%
      # -----------------------------------------------------------
      - name: Run Container with CPU 20% (Test Only)
        shell: pwsh
        run: |
          Write-Host "🚀 Launching container with CPU limit 20% (fast test)..."
          
          # --isolation=process، --cpus=0.2
          docker run --rm `
            --isolation=process `
            --cpus=0.2 `
            --memory=2G `
            -v "${PWD}:C:/app" `
            -w C:/app `
            mcr.microsoft.com/windows/servercore:ltsc2022 `
            powershell -File test_cpu.ps1
