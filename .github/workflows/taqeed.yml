name: Strict 20% CPU Hard-Cap Test
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Start Docker Engine
        shell: pwsh
        run: |
          Set-Service docker -StartupType Automatic
          Start-Service docker

      - name: Execute Strict CPU Hard-Cap Verification
        shell: pwsh
        run: |
          $script = @'
          Write-Host "[CONTAINER] Initializing Single-Thread CPU Burner..."

          # تشغيل خيط ضغط واحد محدد بأعلى أولوية لمنع التوازيات الوهمية بين الأنوية
          Add-Type -TypeDefinition @"
          using System;
          using System.Threading;

          public class SingleThreadBurner {
              public static void StartBurn() {
                  Thread t = new Thread(() => {
                      while (true) {
                          // Tight loop on 1 core
                      }
                  });
                  t.IsBackground = true;
                  t.Priority = ThreadPriority.Highest;
                  t.Start();
              }
          }
          "@

          [SingleThreadBurner]::StartBurn()

          Write-Host "[CONTAINER] Waiting 3 seconds for Windows Job Object rate limiter to apply..."
          Start-Sleep -Seconds 3

          Write-Host "[CONTAINER] Monitoring CPU consumption (Target: Hard Cap at 20.0%)..."
          Write-Host "---------------------------------------------------------------------------------"

          $process = [System.Diagnostics.Process]::GetCurrentProcess()
          $globalSw = [System.Diagnostics.Stopwatch]::StartNew()
          $globalStartCpu = $process.TotalProcessorTime

          $lastCpu = $globalStartCpu
          $exceeded = $false
          $maxInstant = 0

          for ($i = 1; $i -le 10; $i++) {
              $intervalSw = [System.Diagnostics.Stopwatch]::StartNew()
              Start-Sleep -Seconds 1
              $intervalSw.Stop()

              $currentCpu = $process.TotalProcessorTime
              $currentTimeMs = $globalSw.Elapsed.TotalMilliseconds

              # الاستهلاك اللحظي خلال الثانية الأخيرة
              $intervalCpuMs = ($currentCpu - $lastCpu).TotalMilliseconds
              $intervalTimeMs = $intervalSw.Elapsed.TotalMilliseconds
              $instantUsage = ($intervalCpuMs / $intervalTimeMs) * 100

              # الاستهلاك التراكمي العام
              $totalCpuMs = ($currentCpu - $globalStartCpu).TotalMilliseconds
              $cumulativeUsage = ($totalCpuMs / $currentTimeMs) * 100

              if ($instantUsage -gt $maxInstant) { $maxInstant = $instantUsage }
              $lastCpu = $currentCpu

              # السماح بنسبة 22.0% كحد أقصى لتغطية دقة مؤقت نظام ويندوز (15.6ms Clock Quantum)
              $status = if ($instantUsage -le 22.0) { "OK" } else { "BREACHED!" }
              Write-Host "Sample $i/10 -> Instant: $($instantUsage.ToString('0.0'))% | Cumulative: $($cumulativeUsage.ToString('0.0'))% [$status]"

              if ($instantUsage -gt 22.0) {
                  $exceeded = $true
              }
          }

          $globalSw.Stop()

          Write-Host "---------------------------------------------------------------------------------"
          Write-Host "=== FINAL HARD-CAP VERIFICATION ==="
          Write-Host "Target Limit        : 20.0% of 1 Core"
          Write-Host "Peak Instant Usage  : $($maxInstant.ToString('0.0'))%"
          Write-Host "Final Cumulative    : $($cumulativeUsage.ToString('0.0'))%"
          Write-Host "---------------------------------------------------------------------------------"

          if (-not $exceeded) {
              Write-Host "✅ HARD-CAP STRICTLY ENFORCED: CPU usage remained capped at 20%!"
          } else {
              Write-Host "❌ HARD-CAP BREACHED: CPU usage exceeded the limit!"
              exit 1
          }
          '@

          $script | Out-File -FilePath stress.ps1 -Encoding ASCII

          docker run --rm `
            --isolation=process `
            --cpus=0.2 `
            --memory=2G `
            -v "${PWD}:C:/app" `
            -w C:/app `
            mcr.microsoft.com/windows/servercore:ltsc2022 `
            powershell -ExecutionPolicy Bypass -File C:/app/stress.ps1
