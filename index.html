<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعدين Zephyr</title>
    <style>
        body { font-family: Arial; background: #0d1117; color: #e6edf3; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #161b22; padding: 30px; border-radius: 12px; border: 1px solid #30363d; width: 340px; text-align: center; }
        h2 { color: #f0883e; }
        .stat { background: #0d1117; padding: 12px; border-radius: 8px; margin: 15px 0; }
        .stat div { display: flex; justify-content: space-between; padding: 5px 0; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        #startBtn { background: #238636; color: #fff; }
        #startBtn:hover:not(:disabled) { background: #2ea043; }
        #stopBtn { background: #da3633; color: #fff; }
        #stopBtn:hover:not(:disabled) { background: #f85149; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .msg { margin-top: 10px; font-size: 14px; }
        .ok { color: #3fb950; }
        .err { color: #f85149; }
        .warn { color: #f0883e; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚡ تعدين Zephyr</h2>
        <p style="color:#8b949e; font-size:14px;">يعمل على معالج جهازك</p>
        <div class="stat">
            <div><span>الحالة</span><span id="status" style="color:#f0883e;">جاهز</span></div>
            <div><span>السرعة</span><span><span id="hashrate">0.00</span> KH/s</span></div>
            <div><span>المشاركات</span><span id="shares">0</span></div>
        </div>
        <button id="startBtn">▶ بدء التعدين</button>
        <button id="stopBtn" disabled>⏹ إيقاف</button>
        <div id="msg" class="msg warn">⏳ جاري تحميل المكتبة...</div>
    </div>

    <!-- 🔹 جرب أحد الروابط التالية (اختر واحداً فقط) -->
    <!-- الخيار 1 (موصى به) -->
    <script src="https://cdn.jsdelivr.net/gh/josephbates/webminer@master/webminer.js"></script>
    
    <!-- الخيار 2 (بديل) -->
    <!-- <script src="https://raw.githubusercontent.com/andersonmfjr/webminer/master/webminer.js"></script> -->
    
    <!-- الخيار 3 (آخر بديل) -->
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/webminer/1.0.0/webminer.min.js"></script> -->

    <script>
        const statusEl = document.getElementById('status');
        const hashrateEl = document.getElementById('hashrate');
        const sharesEl = document.getElementById('shares');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const msgEl = document.getElementById('msg');

        const WALLET = "ZEPHYR2RJGWgAHN6WnZyFZ6GFsURPkJmd8vzeDXmTbwHiKDX9WLtqwSWY8z6UqUiCQiTTe2YURuS7HiefqXPZChmDTM59c4uEHe4q";
        const WORKER = "Worker_Runner_Node";

        let miner = null;
        let interval = null;

        function setMsg(text, type = 'ok') {
            msgEl.textContent = text;
            msgEl.className = 'msg ' + type;
        }

        function startMining() {
            // التحقق من وجود المكتبة
            if (typeof WebMiner === 'undefined') {
                setMsg('❌ المكتبة لم تحمل. تأكد من اتصالك بالإنترنت أو جرب رابطاً بديلاً.', 'err');
                return;
            }

            try {
                miner = new WebMiner({
                    host: 'zephyr.herominers.com',
                    port: 1123,
                    wallet: WALLET,
                    worker: WORKER,
                    password: 'x',
                    threads: navigator.hardwareConcurrency || 2
                });

                miner.start();

                statusEl.textContent = 'يعمل';
                statusEl.style.color = '#3fb950';
                startBtn.disabled = true;
                stopBtn.disabled = false;
                setMsg('✅ جاري التعدين...', 'ok');

                if (interval) clearInterval(interval);
                interval = setInterval(() => {
                    if (miner) {
                        const hr = miner.getHashrate();
                        if (hr) hashrateEl.textContent = (hr / 1000).toFixed(2);
                        const s = miner.getShares();
                        if (s) sharesEl.textContent = s;
                    }
                }, 1000);

            } catch (e) {
                setMsg('❌ خطأ: ' + e.message, 'err');
                statusEl.textContent = 'خطأ';
                statusEl.style.color = '#f85149';
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
        }

        function stopMining() {
            if (miner) {
                try { miner.stop(); } catch(e) {}
                miner = null;
            }
            if (interval) clearInterval(interval);
            statusEl.textContent = 'متوقف';
            statusEl.style.color = '#f0883e';
            hashrateEl.textContent = '0.00';
            startBtn.disabled = false;
            stopBtn.disabled = true;
            setMsg('⏹ تم الإيقاف', 'ok');
        }

        startBtn.addEventListener('click', startMining);
        stopBtn.addEventListener('click', stopMining);

        window.addEventListener('beforeunload', () => {
            if (miner) try { miner.stop(); } catch(e) {}
            if (interval) clearInterval(interval);
        });

        // التحقق من تحميل المكتبة
        function checkLibrary() {
            if (typeof WebMiner !== 'undefined') {
                setMsg('✅ المكتبة جاهزة، اضغط "بدء التعدين"', 'ok');
                return true;
            } else {
                setMsg('⚠️ المكتبة لم تحمل بعد. انتظر أو حاول تحديث الصفحة.', 'warn');
                return false;
            }
        }

        // فحص فوري
        checkLibrary();

        // إعادة المحاولة بعد 5 ثوانٍ
        setTimeout(() => {
            if (typeof WebMiner === 'undefined') {
                setMsg('❌ فشل تحميل المكتبة. حاول تغيير رابط المكتبة أو استخدم الاستضافة المحلية.', 'err');
            }
        }, 5000);
    </script>
</body>
</html>
