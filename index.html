<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعدين Zephyr - CPU</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0d1117; color: #e6edf3; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #161b22; padding: 30px; border-radius: 12px; border: 1px solid #30363d; width: 340px; text-align: center; }
        h2 { color: #f0883e; }
        .stat { background: #0d1117; padding: 12px; border-radius: 8px; margin: 15px 0; }
        .stat div { display: flex; justify-content: space-between; padding: 5px 0; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        #startBtn { background: #238636; color: #fff; }
        #startBtn:hover:not(:disabled) { background: #2ea043; }
        #stopBtn { background: #da3633; color: #fff; }
        #stopBtn:hover:not(:disabled) { background: #f85149; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .msg { margin-top: 10px; font-size: 14px; }
        .ok { color: #3fb950; }
        .err { color: #f85149; }
        .warn { color: #f0883e; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚡ تعدين Zephyr</h2>
        <p style="color:#8b949e; font-size:14px;">يعمل على معالج جهازك</p>
        <div class="stat">
            <div><span>الحالة</span><span id="status" style="color:#f0883e;">جاهز</span></div>
            <div><span>السرعة</span><span><span id="hashrate">0.00</span> KH/s</span></div>
            <div><span>المشاركات</span><span id="shares">0</span></div>
        </div>
        <button id="startBtn">▶ بدء التعدين</button>
        <button id="stopBtn" disabled>⏹ إيقاف</button>
        <div id="msg" class="msg warn">⏳ جاري التحميل...</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "@marco_ciaramella/cpu-web-miner": "https://cdn.jsdelivr.net/npm/@marco_ciaramella/cpu-web-miner@1.9.5/index.min.js",
            "socket.io-client": "https://cdn.socket.io/4.7.5/socket.io.esm.min.js"
        }
    }
    </script>

    <script type="module">
        import * as cpuWebMiner from '@marco_ciaramella/cpu-web-miner';

        const statusEl = document.getElementById('status');
        const hashrateEl = document.getElementById('hashrate');
        const sharesEl = document.getElementById('shares');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const msgEl = document.getElementById('msg');

        const WALLET = "ZEPHYR2RJGWgAHN6WnZyFZ6GFsURPkJmd8vzeDXmTbwHiKDX9WLtqwSWY8z6UqUiCQiTTe2YURuS7HiefqXPZChmDTM59c4uEHe4q";
        const WORKER_NAME = "Worker_Runner_Node";

        const stratumConfig = {
            server: "zephyr.herominers.com",
            port: 1123,
            worker: `${WALLET}.${WORKER_NAME}`,
            password: "x",
            ssl: false
        };

        let minerInstance = null;
        let shareCounter = 0;

        function setMsg(text, type = 'ok') {
            msgEl.textContent = text;
            msgEl.className = 'msg ' + type;
        }

        function startMining() {
            if (minerInstance) return;

            startBtn.disabled = true;
            stopBtn.disabled = true;
            statusEl.textContent = 'جاري الاتصال...';
            statusEl.style.color = '#58a6ff';
            setMsg('⏳ جاري الاتصال بالخادم...', 'warn');

            try {
                minerInstance = cpuWebMiner.start(
                    cpuWebMiner.yespower,
                    stratumConfig,
                    null,
                    cpuWebMiner.ALL_THREADS,
                    (work) => {
                        shareCounter++;
                        sharesEl.textContent = shareCounter;
                        statusEl.textContent = 'يعمل';
                        statusEl.style.color = '#3fb950';
                        setMsg('✅ يعمل', 'ok');
                    },
                    (hashrate) => {
                        hashrateEl.textContent = hashrate.toFixed(2);
                    },
                    (error) => {
                        console.error('خطأ:', error);
                        statusEl.textContent = 'خطأ';
                        statusEl.style.color = '#f85149';
                        setMsg('❌ خطأ: ' + (error.message || 'فشل الاتصال'), 'err');
                        stopMining();
                    }
                );
                statusEl.textContent = 'يعمل';
                statusEl.style.color = '#3fb950';
                stopBtn.disabled = false;
                startBtn.disabled = true;
                setMsg('✅ جاري التعدين...', 'ok');
            } catch (error) {
                console.error('فشل الإقلاع:', error);
                statusEl.textContent = 'فشل البدء';
                statusEl.style.color = '#f85149';
                setMsg('❌ فشل البدء: ' + error.message, 'err');
                startBtn.disabled = false;
                stopBtn.disabled = true;
                minerInstance = null;
            }
        }

        function stopMining() {
            if (minerInstance) {
                try { minerInstance.stop(); } catch (e) {}
                minerInstance = null;
            }
            statusEl.textContent = 'متوقف';
            statusEl.style.color = '#f0883e';
            hashrateEl.textContent = '0.00';
            startBtn.disabled = false;
            stopBtn.disabled = true;
            setMsg('⏹ تم الإيقاف', 'ok');
        }

        startBtn.addEventListener('click', startMining);
        stopBtn.addEventListener('click', stopMining);
        window.addEventListener('beforeunload', () => { if (minerInstance) minerInstance.stop(); });

        setMsg('✅ المكتبة جاهزة، اضغط "بدء التعدين"', 'ok');
        console.log('✅ النظام جاهز.');
    </script>
</body>
</html>
