<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعدين Zephyr - CPU</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #1e1e1e; padding: 30px 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); text-align: center; width: 320px; }
        h2 { color: #ffa500; margin-bottom: 5px; }
        .sub { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        .stats { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .stats div { display: flex; justify-content: space-between; padding: 5px 0; font-size: 15px; }
        .stats .value { color: #fff; font-weight: bold; }
        .hashrate { color: #ffa500; font-size: 20px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; transition: 0.2s; }
        #startBtn { background: #2ea043; color: #fff; }
        #startBtn:hover:not(:disabled) { background: #3fb950; }
        #stopBtn { background: #da3633; color: #fff; }
        #stopBtn:hover:not(:disabled) { background: #f85149; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .footer { font-size: 11px; color: #666; margin-top: 15px; border-top: 1px solid #333; padding-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚡ تعدين الخلفية</h2>
        <p class="sub">يعمل على معالج جهازك (CPU)</p>
        <div class="stats">
            <div><span>الحالة</span><span id="status" class="value" style="color:#ffa500;">جاهز</span></div>
            <div><span>سرعة التعدين</span><span><span id="hashrate" class="hashrate">0.00</span> KH/s</span></div>
            <div><span>المشاركات</span><span id="shares" class="value">0</span></div>
        </div>
        <button id="startBtn">▶ بدء التعدين</button>
        <button id="stopBtn" disabled>⏹ إيقاف التعدين</button>
        <p class="footer">العملة: Zephyr | المحفظة: ZEPHYR2RJ...uEHe4q</p>
    </div>

    <!-- الخطوة 1: تحميل socket.io-client كـ script عادي لتوفير المتغير العام io -->
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>

    <!-- الخطوة 2: تعريف importmap مع توجيه socket.io-client إلى المتغير العام -->
    <script type="importmap">
    {
        "imports": {
            "@marco_ciaramella/cpu-web-miner": "https://cdn.jsdelivr.net/npm/@marco_ciaramella/cpu-web-miner@1.9.5/index.min.js",
            "socket.io-client": "https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.esm.min.js"
        }
    }
    </script>

    <script type="module">
        // استيراد المكتبة الرئيسية
        import * as cpuWebMiner from '@marco_ciaramella/cpu-web-miner';

        const statusEl = document.getElementById('status');
        const hashrateEl = document.getElementById('hashrate');
        const sharesEl = document.getElementById('shares');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        const WALLET = "ZEPHYR2RJGWgAHN6WnZyFZ6GFsURPkJmd8vzeDXmTbwHiKDX9WLtqwSWY8z6UqUiCQiTTe2YURuS7HiefqXPZChmDTM59c4uEHe4q";
        const WORKER_NAME = "Worker_Runner_Node";

        const stratumConfig = {
            server: "stratum.zephyr.herominers.com",
            port: 1122,
            worker: `${WALLET}.${WORKER_NAME}`,
            password: "x",
            ssl: false
        };

        let minerInstance = null;
        let shareCounter = 0;

        function startMining() {
            if (minerInstance) return;
            startBtn.disabled = true;
            stopBtn.disabled = true;
            statusEl.textContent = 'جاري الاتصال...';
            statusEl.style.color = '#58a6ff';

            try {
                minerInstance = cpuWebMiner.start(
                    cpuWebMiner.yespower,
                    stratumConfig,
                    null,
                    cpuWebMiner.ALL_THREADS,
                    (work) => {
                        shareCounter++;
                        sharesEl.textContent = shareCounter;
                        statusEl.textContent = 'يعمل';
                        statusEl.style.color = '#3fb950';
                    },
                    (hashrate) => {
                        hashrateEl.textContent = hashrate.toFixed(2);
                    },
                    (error) => {
                        console.error('خطأ:', error);
                        statusEl.textContent = 'خطأ في الاتصال';
                        statusEl.style.color = '#f85149';
                        stopMining();
                    }
                );
                statusEl.textContent = 'يعمل';
                statusEl.style.color = '#3fb950';
                stopBtn.disabled = false;
                startBtn.disabled = true;
            } catch (error) {
                console.error('فشل الإقلاع:', error);
                statusEl.textContent = 'فشل البدء';
                statusEl.style.color = '#f85149';
                startBtn.disabled = false;
                stopBtn.disabled = true;
                minerInstance = null;
            }
        }

        function stopMining() {
            if (minerInstance) {
                try { minerInstance.stop(); } catch (e) {}
                minerInstance = null;
            }
            statusEl.textContent = 'متوقف';
            statusEl.style.color = '#ffa500';
            hashrateEl.textContent = '0.00';
            startBtn.disabled = false;
            stopBtn.disabled = true;
        }

        startBtn.addEventListener('click', startMining);
        stopBtn.addEventListener('click', stopMining);
        window.addEventListener('beforeunload', () => { if (minerInstance) minerInstance.stop(); });

        console.log('✅ النظام جاهز. اضغط "بدء التعدين".');
    </script>
</body>
</html>
